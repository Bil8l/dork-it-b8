<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 312" width="400" role="img" aria-labelledby="md-title md-desc">
  <title id="md-title">Dork it B8 dork list</title>
  <desc id="md-desc">The Recon category open in Dork it B8: monospaced dork keys in accent purple with descriptions, and star plus sweep buttons revealed on the hovered row.</desc>
  <defs>
    <filter id="md-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="299" height="311" rx="8" fill="#111111" stroke="#2a2a2a" filter="url(#md-shadow)"/>
  <rect x="1" y="1" width="298" height="40" rx="7" fill="#1a1a1a"/>
  <rect x="1" y="28" width="298" height="13" fill="#1a1a1a"/>
  <text x="16" y="25" font-family="'Segoe UI', sans-serif" font-size="15" fill="#bb86fc">&#x2190;</text>
  <text x="40" y="24" font-family="'Segoe UI', sans-serif" font-size="11" letter-spacing="0.5" fill="#999999">Recon</text>

  <!-- hovered row background -->
  <rect x="1" y="98" width="298" height="58" fill="#1e1e1e"/>

  <g font-family="Consolas, monospace" font-size="12" fill="#bb86fc">
    <text x="14" y="60">site:*.[domain] -www</text>
    <text x="14" y="118">site:*.[domain] inurl:api</text>
    <text x="14" y="176">site:*.[domain] inurl:dev |</text>
    <text x="14" y="193">inurl:staging</text>
    <text x="14" y="252">site:*.[domain] ext:pdf |</text>
    <text x="14" y="269">ext:doc | ext:docx</text>
  </g>
  <g font-family="'Segoe UI', sans-serif" font-size="11" fill="#999999">
    <text x="14" y="80">All subdomains, exclude www</text>
    <text x="14" y="138">API endpoints</text>
    <text x="14" y="212">Dev / staging environments</text>
    <text x="14" y="288">Public documents</text>
  </g>

  <!-- ghost action buttons (idle rows) -->
  <g font-family="'Segoe UI', sans-serif" font-size="13" fill="#666666" opacity="0.55" text-anchor="middle">
    <text x="252" y="64">&#x2606;</text>
    <text x="274" y="64">&#x2295;</text>
    <text x="252" y="180">&#x2606;</text>
    <text x="274" y="180">&#x2295;</text>
    <text x="252" y="256">&#x2606;</text>
    <text x="274" y="256">&#x2295;</text>
  </g>
  <!-- active buttons (hovered row) -->
  <g font-family="'Segoe UI', sans-serif" font-size="13" text-anchor="middle">
    <text x="252" y="122" fill="#e6b800">&#x2605;</text>
    <text x="274" y="122" fill="#bb86fc">&#x2295;</text>
  </g>

  <g stroke="#1d1d1d">
    <line x1="1" y1="98" x2="299" y2="98"/>
    <line x1="1" y1="156" x2="299" y2="156"/>
    <line x1="1" y1="232" x2="299" y2="232"/>
  </g>
</svg>
