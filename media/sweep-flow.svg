<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="820" role="img" aria-labelledby="fl-title fl-desc">
  <title id="fl-title">How sweep mode works</title>
  <desc id="fl-desc">Four-step flow: type a base query, queue dorks with the plus button, the sweep bar appears, then cycle and auto-submit; reloading the page keeps the queue via sessionStorage.</desc>
  <defs>
    <marker id="fl-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b9bdc7"/>
    </marker>
  </defs>
  <rect width="880" height="296" fill="#ffffff"/>
  <text x="36" y="40" font-family="Consolas, monospace" font-size="11" letter-spacing="2.5" fill="#8a8f98">HOW SWEEP MODE WORKS</text>

  <!-- connectors -->
  <g stroke="#b9bdc7" stroke-width="1.5" fill="none">
    <line x1="206" y1="124" x2="243" y2="124" marker-end="url(#fl-arrow)"/>
    <line x1="418" y1="124" x2="455" y2="124" marker-end="url(#fl-arrow)"/>
    <line x1="630" y1="124" x2="667" y2="124" marker-end="url(#fl-arrow)"/>
    <path d="M756,172 L756,220 Q756,228 748,228 L552,228 Q544,228 544,220 L544,177" marker-end="url(#fl-arrow)"/>
  </g>
  <rect x="462" y="218" width="164" height="20" fill="#ffffff"/>
  <text x="544" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="10" letter-spacing="0.5" fill="#8a8f98">RELOADS KEEP THE QUEUE</text>

  <!-- nodes -->
  <g>
    <rect x="36" y="76" width="168" height="96" rx="6" fill="#ffffff" stroke="#d9dbe3" stroke-width="1.2"/>
    <text x="120" y="112" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#2d3142">1 &#183; Type base query</text>
    <text x="120" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#8a8f98">site:example.com&#160;</text>
  </g>
  <g>
    <rect x="248" y="76" width="168" height="96" rx="6" fill="#ffffff" stroke="#d9dbe3" stroke-width="1.2"/>
    <text x="332" y="112" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#2d3142">2 &#183; Queue dorks</text>
    <text x="332" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#8a8f98">click &#x2295; on any dork</text>
    <text x="332" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#8a8f98">from any category</text>
  </g>
  <g>
    <rect x="460" y="76" width="168" height="96" rx="6" fill="#ffffff" stroke="#7c4dcc" stroke-width="1.6"/>
    <text x="544" y="112" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#6d28d9">3 &#183; Sweep bar appears</text>
    <text x="544" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#8a8f98">&#x25C0;&#xFE0E; key &#x25B6;&#xFE0E; &#183; 2/6</text>
    <text x="544" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#8a8f98">bottom of the page</text>
  </g>
  <g>
    <rect x="672" y="76" width="168" height="96" rx="6" fill="#ffffff" stroke="#d9dbe3" stroke-width="1.2"/>
    <text x="756" y="112" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#2d3142">4 &#183; Cycle &amp; submit</text>
    <text x="756" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#8a8f98">Ctrl+Shift+[ / ]</text>
    <text x="756" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#8a8f98">auto-presses Enter</text>
  </g>

  <text x="36" y="274" font-family="Consolas, monospace" font-size="10" fill="#8a8f98">queue &amp; position: sessionStorage (this tab) &#183; favorites &amp; custom dorks: localStorage. Nothing leaves your browser.</text>
</svg>
