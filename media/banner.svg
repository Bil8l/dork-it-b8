<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Dork it B8</title>
  <desc id="banner-desc">Banner for the Dork it B8 userscript: a Google dorking assistant with 100 curated dorks, sweep mode, and no network calls.</desc>
  <rect width="1280" height="320" fill="#0f0f14"/>
  <text x="1240" y="52" text-anchor="end" font-family="Consolas, monospace" font-size="15" fill="#1b1b26">site:*.[domain] inurl:api | inurl:dev</text>
  <text x="84" y="212" font-family="'Segoe UI', sans-serif" font-size="160" fill="#bb86fc">&#x283F;</text>
  <text x="300" y="140" font-family="'Segoe UI', sans-serif" font-size="62" font-weight="700" letter-spacing="-1" fill="#ffffff">DORK IT B8</text>
  <rect x="304" y="162" width="92" height="6" rx="3" fill="#bb86fc"/>
  <text x="304" y="206" font-family="'Segoe UI', sans-serif" font-size="17" fill="#999999">A Google dorking assistant that lives in your search bar.</text>
  <text x="304" y="236" font-family="Consolas, monospace" font-size="13" fill="#8a8f98">100 curated dorks &#183; sweep mode &#183; favorites &amp; custom dorks &#183; zero network calls</text>
  <g font-family="Consolas, monospace" font-size="11" fill="#999999" text-anchor="middle">
    <rect x="818" y="264" width="140" height="28" rx="14" fill="#14141a" stroke="#2a2a2a"/>
    <text x="888" y="282" letter-spacing="1">TAMPERMONKEY</text>
    <rect x="970" y="264" width="140" height="28" rx="14" fill="#14141a" stroke="#2a2a2a"/>
    <text x="1040" y="282" letter-spacing="1">14 CATEGORIES</text>
    <rect x="1122" y="264" width="118" height="28" rx="14" fill="#14141a" stroke="#2a2a2a"/>
    <text x="1181" y="282" letter-spacing="1">100% LOCAL</text>
  </g>
</svg>
