<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 356" width="400" role="img" aria-labelledby="mc-title mc-desc">
  <title id="mc-title">Dork it B8 category menu</title>
  <desc id="mc-desc">The script's dark menu listing Recent, Favorites, Custom and the built-in dork categories with item counts.</desc>
  <defs>
    <filter id="mc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="mc-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111111" stop-opacity="0"/>
      <stop offset="1" stop-color="#111111" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="299" height="355" rx="8" fill="#111111" stroke="#2a2a2a" filter="url(#mc-shadow)"/>
  <rect x="1" y="1" width="298" height="40" rx="7" fill="#1a1a1a"/>
  <rect x="1" y="28" width="298" height="13" fill="#1a1a1a"/>
  <text x="14" y="25" font-family="'Segoe UI', sans-serif" font-size="11" letter-spacing="1" fill="#999999">&#x283F; DORK IT B8</text>
  <text x="286" y="25" text-anchor="end" font-family="'Segoe UI', sans-serif" font-size="12" fill="#666666">&#x2715;</text>

  <!-- rows -->
  <g font-family="'Segoe UI', sans-serif">
    <text x="14" y="60" font-size="13" fill="#bb86fc">Recent</text>
    <text x="14" y="91" font-size="13" fill="#bb86fc">Favorites</text>
    <text x="14" y="122" font-size="13" fill="#bb86fc">Custom</text>
    <text x="14" y="153" font-size="13" fill="#cccccc">Operators</text>
    <text x="14" y="184" font-size="13" fill="#cccccc">Recon</text>
    <text x="14" y="215" font-size="13" fill="#cccccc">Footholds</text>
    <text x="14" y="246" font-size="13" fill="#cccccc">Sensitive Dirs</text>
    <text x="14" y="277" font-size="13" fill="#cccccc">Vulnerable Files</text>
    <text x="14" y="308" font-size="13" fill="#cccccc">Vulnerable Servers</text>
    <text x="14" y="339" font-size="13" fill="#cccccc">Error Messages</text>
  </g>
  <g text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" fill="#666666">
