    <rect x="228" y="79" width="20" height="15" rx="7.5" fill="#1a1a1a"/><text x="238" y="89.5">7</text>
    <rect x="228" y="110" width="20" height="15" rx="7.5" fill="#1a1a1a"/><text x="238" y="120.5">2</text>
