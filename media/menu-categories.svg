    <text x="277" y="123">&#x203A;</text>
    <text x="277" y="154">&#x203A;</text>
    <text x="277" y="185">&#x203A;</text>
    <text x="277" y="216">&#x203A;</text>
    <text x="277" y="247">&#x203A;</text>
    <text x="277" y="278">&#x203A;</text>
    <text x="277" y="309">&#x203A;</text>
    <text x="277" y="340">&#x203A;</text>
