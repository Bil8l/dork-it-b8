    <rect x="228" y="234" width="20" height="15" rx="7.5" fill="#1a1a1a"/><text x="238" y="244.5">8</text>
    <rect x="228" y="265" width="20" height="15" rx="7.5" fill="#1a1a1a"/><text x="238" y="275.5">9</text>
    <rect x="228" y="296" width="20" height="15" rx="7.5" fill="#1a1a1a"/><text x="238" y="306.5">8</text>
