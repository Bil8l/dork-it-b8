<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 212" width="640" role="img" aria-labelledby="sb-title sb-desc">
  <title id="sb-title">Dork it B8 sweep bar</title>
  <desc id="sb-desc">A Google search box where the sweep bar has swapped in the dork intitle:"index of" "backup", showing position 2 of 6 with auto-submit enabled.</desc>
  <defs>
    <filter id="sb-bar" x="-20%" y="-50%" width="140%" height="220%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#202124" flood-opacity="0.2"/>
    </filter>
    <filter id="sb-pill" x="-20%" y="-60%" width="140%" height="240%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="640" height="212" fill="#ffffff"/>

  <!-- Google search box -->
  <rect x="48" y="36" width="544" height="44" rx="22" fill="#ffffff" stroke="#dfe1e5" stroke-width="1.2" filter="url(#sb-bar)"/>
  <circle cx="80" cy="58" r="7" fill="none" stroke="#9aa0a6" stroke-width="2"/>
  <line x1="85" y1="63" x2="91" y2="69" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
  <rect x="222" y="48" width="196" height="21" rx="4" fill="#bb86fc" opacity="0.16"/>
  <text x="106" y="63" font-family="'Segoe UI', sans-serif" font-size="14" fill="#202124">site:example.com&#160;</text>
  <text x="226" y="63" font-family="'Segoe UI', sans-serif" font-size="14" fill="#202124">intitle:"index of" "backup"</text>
  <rect x="422" y="49" width="2" height="18" fill="#1a73e8"/>
  <text x="106" y="102" font-family="'Segoe UI', sans-serif" font-size="11" fill="#5f6368">The queued dork is swapped into your query (position 2 of 6).</text>

  <!-- sweep pill -->
  <rect x="100" y="124" width="440" height="42" rx="21" fill="#161616" stroke="#2a2a2a" filter="url(#sb-pill)"/>
  <text x="118" y="150" font-family="Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#666666">SWEEP</text>
  <text x="164" y="151" font-family="'Segoe UI', sans-serif" font-size="12" fill="#999999">&#x25C0;&#xFE0E;</text>
  <text x="184" y="150" font-family="Consolas, monospace" font-size="11" fill="#bb86fc">intitle:"index of" "backup"</text>
  <text x="372" y="150" font-family="Consolas, monospace" font-size="10" fill="#666666">2/6</text>
  <text x="396" y="151" font-family="'Segoe UI', sans-serif" font-size="12" fill="#999999">&#x25B6;&#xFE0E;</text>
  <text x="418" y="150" font-family="'Segoe UI', sans-serif" font-size="11" fill="#333333">|</text>
  <rect x="430" y="139" width="12" height="12" rx="2.5" fill="#bb86fc"/>
  <path d="M433 145.5 l2.5 2.5 l4.5 -6" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="448" y="150" font-family="'Segoe UI', sans-serif" font-size="10" fill="#999999">Auto</text>
  <text x="516" y="150" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#666666">&#x2715;</text>

  <text x="320" y="194" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#9aa0a6">Ctrl+Shift+[ / ] to cycle &#183; Auto submits each query with Enter</text>
</svg>
